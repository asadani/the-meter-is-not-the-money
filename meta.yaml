    # is gone, that section's argument has changed.
    - "base currency is US dollars"                  # 1
    - "no markup on inference pricing"               # 2
    - "inverse square"                               # 3
    - "no markup and no platform fee on tokens"      # 4
    - "destined for commoditization"                 # 5
    - "Claude Consumption Units"                     # 6
  matter_probes:
    - "Copyright, permissions"
    - "About the author"
  allow_system_fonts: false
  min_images: 0
  expect_pages: 30
  page_tolerance: 3
