# The Meter Is Not the Money -- book-forge configuration.
#
# Flow mode: a short book for engineers and founders who have to budget AI
# spend, one continuous page on screen, paginated in print. Research workspace
# lives in research/ -- 38 captured sources, 77 claims, each
# <sup class="cite">c-0NN</sup> resolving to a row in research/claims.jsonl.

slug: the-meter-is-not-the-money
title: "The Meter Is Not the Money"
subtitle: "How AI compute gets priced, metered, and paid for"
theme: sheet-oxblood

source:
  template: book.html.in
output:
  html: index.html
  pdf: the-meter-is-not-the-money.pdf

page:
  size: A4

cover:
  art: assets/the-meter-is-not-the-money-cover.png
  fit: crop
  trim_top_share: 0.47
  dpi: 300

qr:
  - slot: QR_AUTHOR
    target: https://anujsadani.in
    label: "Writing and work"
  - slot: QR_TECH
    target: https://tech.anujsadani.in/the-meter-is-not-the-money/
